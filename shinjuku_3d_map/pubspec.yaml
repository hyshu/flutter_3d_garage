name: shinjuku_3d_map
description: Project PLATEAU textured Shinjuku buildings rendered with Flutter GPU.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter: { sdk: flutter }
  flutter_gpu: { sdk: flutter }
  flutter_scene: 0.23.0
  hooks: 2.0.2
  maplibre_flutter_gpu: 0.0.6
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - build/shaderbundles/
